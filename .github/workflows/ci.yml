name: CI

on:
  push:
  pull_request:

jobs:
  phase-zero-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Mengambil repository
        uses: actions/checkout@v4

      - name: Menyiapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Memasang dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Memeriksa source code
        run: ruff check src app tests

      - name: Menjalankan pengujian
        run: pytest

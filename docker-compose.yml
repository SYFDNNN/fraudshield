services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraudshield:phase7
    environment:
      FRAUDSHIELD_CONFIG_PATH: configs/base.yaml
      FRAUDSHIELD_LOG_LEVEL: INFO
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  streamlit:
    image: fraudshield:phase7
    depends_on:
      api:
        condition: service_healthy
    environment:
      FRAUDSHIELD_API_URL: http://api:8000
      FRAUDSHIELD_API_TIMEOUT_SECONDS: 15
    command:
      - streamlit
      - run
      - app/streamlit_app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

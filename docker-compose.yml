services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: fraudshield:latest
    environment:
      FRAUDSHIELD_CONFIG_PATH: configs/base.yaml
      FRAUDSHIELD_LOG_LEVEL: INFO
    volumes:
      - ./artifacts:/app/artifacts:ro
    ports:
      - "8000:8000"
    restart: unless-stopped

  flask:
    image: fraudshield:latest
    depends_on:
      api:
        condition: service_healthy
    environment:
      FRAUDSHIELD_API_URL: http://api:8000
      FRAUDSHIELD_API_TIMEOUT_SECONDS: 15
    command:
      - flask
      - --app
      - app.flask_app
      - run
      - --host=0.0.0.0
      - --port=5000
    ports:
      - "5000:5000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:5000/', timeout=3)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

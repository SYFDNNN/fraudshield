project:
  name: fraudshield
  random_seed: 42

data:
  variant: Base
  raw_path: data/raw/Base.csv
  target_column: fraud_bool
  time_column: month

split:
  strategy: temporal
  train_periods:
    - 0
    - 1
    - 2
    - 3
    - 4
  calibration_periods:
    - 5
  validation_periods:
    - 6
  test_periods:
    - 7

feature_policy:
  excluded_from_model:
    - fraud_bool
    - month
    - device_fraud_count
    - days_since_request
    - credit_risk_score

  historical_aggregate_features:
    - zip_count_4w
    - velocity_6h
    - velocity_24h
    - velocity_4w
    - bank_branch_count_8w
    - date_of_birth_distinct_emails_4w
    - device_distinct_emails_8w

  historical_aggregate_assumption: >
    Every aggregate feature must contain only information available before
    the current application prediction time.

  high_drift_features:
    - velocity_4w
    - velocity_24h
    - velocity_6h
    - zip_count_4w
    - date_of_birth_distinct_emails_4w

preprocessing:
  categorical_features:
    - payment_type
    - employment_status
    - housing_status
    - source
    - device_os

  semantic_missing_rules:
    prev_address_months_count:
      operator: equals
      value: -1
    current_address_months_count:
      operator: equals
      value: -1
    bank_months_count:
      operator: equals
      value: -1
    session_length_in_minutes:
      operator: equals
      value: -1
    device_distinct_emails_8w:
      operator: equals
      value: -1
    intended_balcon_amount:
      operator: less_than
      value: 0

  add_missing_indicators: true
  numeric_imputer_strategy: median
  categorical_imputer_strategy: most_frequent
  scale_numeric: true

baseline:
  primary_model_name: logistic_regression_balanced

  dummy:
    strategy: prior

  logistic_regression:
    C: 1.0
    class_weight: balanced
    solver: lbfgs
    max_iter: 500
    tolerance: 0.0001

  high_drift_ablation:
    enabled: true
    model_name: logistic_regression_without_high_drift

xgboost:
  objective: binary:logistic
  eval_metric: aucpr
  tree_method: hist
  importance_type: gain
  n_jobs: -1
  verbosity: 1
  scale_numeric: false
  maximum_candidates: 5

  candidates:
    - name: xgboost_shallow_regularized
      n_estimators: 450
      learning_rate: 0.05
      max_depth: 3
      min_child_weight: 10.0
      subsample: 0.80
      colsample_bytree: 0.80
      gamma: 0.0
      reg_alpha: 0.10
      reg_lambda: 5.0

    - name: xgboost_moderate_depth
      n_estimators: 400
      learning_rate: 0.05
      max_depth: 4
      min_child_weight: 15.0
      subsample: 0.80
      colsample_bytree: 0.80
      gamma: 0.05
      reg_alpha: 0.10
      reg_lambda: 7.0

    - name: xgboost_strong_regularization
      n_estimators: 325
      learning_rate: 0.08
      max_depth: 3
      min_child_weight: 25.0
      subsample: 0.90
      colsample_bytree: 0.90
      gamma: 0.10
      reg_alpha: 0.25
      reg_lambda: 10.0

model_selection:
  baseline_model_name: logistic_regression_balanced
  primary_metric: pr_auc_average_precision
  operational_review_rate: 0.05
  minimum_absolute_ap_improvement: 0.002
  maximum_recall_at_capacity_drop: 0.01
  selection_periods:
    - 6
  tie_breakers:
    - recall_at_capacity
    - brier_score
    - training_seconds
    - model_name

calibration:
  base_model_name: xgboost_strong_regularization
  fit_periods:
    - 5
  selection_periods:
    - 6

  candidates:
    - name: sigmoid
      method: sigmoid
      C: 1000000.0
      max_iter: 1000
      clip_epsilon: 0.000001

    - name: isotonic
      method: isotonic
      out_of_bounds: clip

  selection:
    baseline_name: uncalibrated
    primary_metric: brier_score
    minimum_absolute_brier_improvement: 0.001
    maximum_average_precision_drop: 0.005
    tie_breakers:
      - expected_calibration_error
      - log_loss
      - average_precision
      - method_name

threshold_selection:
  selection_periods:
    - 6
  capacity_rate: 0.05
  tie_break_policy: >
    calibrated_score_desc_then_raw_score_desc_then_stable_application_key
  risk_bands:
    - label: sangat_tinggi
      cumulative_review_rate: 0.01
    - label: tinggi
      cumulative_review_rate: 0.05
    - label: menengah
      cumulative_review_rate: 0.10
    - label: rendah
      cumulative_review_rate: 1.00

evaluation:
  review_rates:
    - 0.01
    - 0.03
    - 0.05
    - 0.10
  diagnostic_threshold: 0.50
  calibration_bins: 10

review_policy:
  capacity_rate: 0.05
  decision_threshold: derived_from_validation
  threshold_purpose: manual_review_prioritization_only
  automated_rejection_allowed: false
  risk_categories:
    sangat_tinggi: top_1_percent
    tinggi: percentile_1_to_5
    menengah: percentile_5_to_10
    rendah: below_top_10_percent

final_evaluation:
  evaluation_periods:
    - 7
  phase5_model_artifact: artifacts/phase5/calibrated_review_model.joblib
  phase5_metadata_artifact: artifacts/phase5/phase5_metadata.json
  phase5_metrics_artifact: artifacts/phase5/calibration_metrics.json
  phase5_decision_artifact: artifacts/phase5/calibration_decision.json
  phase5_capacity_artifact: artifacts/phase5/capacity_threshold_policy.json
  phase5_risk_band_artifact: artifacts/phase5/risk_band_policy.json
  completed_result_policy: reuse_without_test_re_evaluation
  error_examples_per_type: 25

  bootstrap:
    method: stratified_percentile
    confidence_level: 0.95
    number_of_resamples: 200
    random_seed: 42

  stability_alerts:
    maximum_average_precision_drop: 0.03
    maximum_recall_at_capacity_drop: 0.05
    maximum_brier_score_increase: 0.005
    maximum_expected_calibration_error_increase: 0.02

  slices:
    minimum_rows: 500
    minimum_positive_rows: 10
    categorical_features:
      - payment_type
      - employment_status
      - housing_status
      - source
      - device_os
    numeric_bins:
      customer_age:
        - 0
        - 25
        - 35
        - 45
        - 55
        - 65
        - 200
      income:
        - 0.0
        - 0.3
        - 0.6
        - 1.1

inference:
  contract_version: "1.0.0"
  model_artifact: artifacts/phase5/calibrated_review_model.joblib
  phase5_metadata_artifact: artifacts/phase5/phase5_metadata.json
  phase6_metadata_artifact: artifacts/phase6/phase6_metadata.json
  phase6_completion_artifact: artifacts/phase6/final_evaluation_completion.json
  expected_model_sha256: 23e59ddb6379608247bfa27f03c8a3e119639313edf0056ea03848892d6eb3e3
  expected_phase6_policy_sha256: 49d08ee7c962ad8293c8de52a65f69656cbd4d62b77c5e3a3691d0d5fbbbfbb9
  model_version_prefix: fraudshield-xgb-sigmoid-v1
  threshold_policy_version: review-capacity-5pct-validation-m6-v1
  maximum_batch_size: 5000
  automated_rejection_allowed: false

artifacts:
  directory: artifacts
  phase3_directory: artifacts/phase3
  phase4_directory: artifacts/phase4
  phase5_directory: artifacts/phase5
  phase6_directory: artifacts/phase6

reports:
  figures_directory: reports/figures
  model_card_path: reports/model_card.md
